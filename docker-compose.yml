version: '3.8'

services:
  # Redis - Message broker for Celery
  redis:
    image: redis:7-alpine
    container_name: cab_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # SQL Server - Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cab_agent_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q "SELECT 1"
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker - Background task processing
  celery_worker:
    build: .
    container_name: cab_agent_celery_worker
    command: celery -A src.services.task_queue worker --loglevel=info --concurrency=10
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - AZURE_DEVOPS_ORG=${AZURE_DEVOPS_ORG}
      - AZURE_DEVOPS_PROJECT=${AZURE_DEVOPS_PROJECT}
      - AZURE_DEVOPS_PAT=${AZURE_DEVOPS_PAT}
    depends_on:
      - redis
      - sqlserver
    restart: unless-stopped
    volumes:
      - .:/app

  # Celery Beat - Scheduler for periodic tasks
  celery_beat:
    build: .
    container_name: cab_agent_celery_beat
    command: celery -A src.services.task_queue beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
      - sqlserver
    restart: unless-stopped
    volumes:
      - .:/app

  # Flower - Celery monitoring UI
  flower:
    build: .
    container_name: cab_agent_flower
    command: celery -A src.services.task_queue flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped

  # CAB Agent Application
  app:
    build: .
    container_name: cab_agent_app
    command: python src/bot/app.py
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - AZURE_DEVOPS_ORG=${AZURE_DEVOPS_ORG}
      - AZURE_DEVOPS_PROJECT=${AZURE_DEVOPS_PROJECT}
      - AZURE_DEVOPS_PAT=${AZURE_DEVOPS_PAT}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
      - ADK_MODEL=${ADK_MODEL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - redis
      - sqlserver
      - celery_worker
    restart: unless-stopped
    volumes:
      - .:/app

volumes:
  redis_data:
  sqlserver_data:
